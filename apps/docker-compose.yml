services:
  # База данных
  postgres_db:
    image: postgres:18-alpine
    container_name: smart-home-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: device
    ports:
      - "7432:5432"
    volumes:
      - ./database/init/init-device.sql:/docker-entrypoint-initdb.d/init-device.sql
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d device"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    platform: linux/amd64
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - smarthome-network
      
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    platform: linux/amd64
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CREATE_TOPICS: "device-command:1:1"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smarthome-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - smarthome-network

  # Frontend
  frontend:
    build:
      context: ${FRONTEND_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-frontend
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "3000:80"
    networks:
      - smarthome-network

  # API Gateway
  api-gateway:
    build:
      context: ${API_GATEWAY_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-api-gateway
    platform: linux/amd64
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${PORT}
      - Kafka__BootstrapServers=${KAFKA_SERVER}
    ports:
      - "7004:${PORT}"
    depends_on:
      device-service:
        condition: service_healthy
      websocket-service:
        condition: service_healthy
      kafka:
        condition: service_healthy    
    networks:
      - smarthome-network

  # Device Service
  device-service:
    build:
      context: ${DEVICE_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-device-service
    platform: linux/amd64
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${PORT}
      - ConnectionStrings__Device=${ConnectionStringDevice}
      - Kafka__BootstrapServers=${KAFKA_SERVER}
    ports:
      - "7001:${PORT}"
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 5s
      timeout: 10s
      retries: 3

    # WebSocket Service
  websocket-service:
    build:
      context: ${WEBSOCKET_CONTEXT}
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: smart-home-websocket-service
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${PORT}
      - Kafka__BootstrapServers=${KAFKA_SERVER}
    ports:
      - "7003:${PORT}"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 5s
      timeout: 10s
      retries: 3



