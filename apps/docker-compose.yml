services:
  # База данных
  postgres_db:
    image: postgres:18-alpine
    container_name: smart-home-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: device
    ports:
      - "7432:5432"
    volumes:
      - ./database/init/init-device.sql:/docker-entrypoint-initdb.d/init-device.sql
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d device"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    container_name: kafka
    image: apache/kafka-native
    ports:
      - 9092:9092
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://10.211.55.3:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped
    networks:
      - smarthome-network

  kafka-ui:
    image: kafbat/kafka-ui:main
    container_name: kafka-ui
    ports:
      - 8090:8080
    restart: always
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

  # Frontend
  frontend:
    build:
      context: ${FRONTEND_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-frontend
    ports:
      - "3000:80"
    networks:
      - smarthome-network

  # API Gateway
  api-gateway:
    build:
      context: ${API_GATEWAY_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-api-gateway
    platform: linux/amd64
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${PORT}
      - Kafka__BootstrapServers=${KAFKA_SERVER}
    ports:
      - "7004:${PORT}"
    depends_on:
      device-service:
        condition: service_healthy
      websocket-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network

  # Device Service
  device-service:
    build:
      context: ${DEVICE_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-device-service
    platform: linux/amd64
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${PORT}
      - ConnectionStrings__Device=${ConnectionStringDevice}
      - Kafka__BootstrapServers=${KAFKA_SERVER}
    ports:
      - "7001:${PORT}"
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scenario Service
  scenario-service:
    build:
      context: ${SCENARIO_CONTEXT}
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: smart-home-scenario-service
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${PORT}
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=smarthome;Username=smarthome_user;Password=${POSTGRES_PASSWORD:-Smarthome123!}
      - Kafka__BootstrapServers=${KAFKA_SERVER}
    ports:
      - "7002:${PORT}"
    depends_on:
      postgres_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket Service
  websocket-service:
    build:
      context: ${WEBSOCKET_CONTEXT}
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: smart-home-websocket-service
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_HTTP_PORTS=${PORT}
      - Kafka__BootstrapServers=kafka:9092
      - Redis__ConnectionString=redis:6379
    ports:
      - "7003:${PORT}"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Integration Service
  integration-service:
    build:
      context: ${INTEGRAION_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-integration-service
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - Kafka__BootstrapServers=kafka:9092
    ports:
      - "7004:80"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  kafka_data:

networks:
  smarthome-network:
    driver: bridge