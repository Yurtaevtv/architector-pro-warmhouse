  smarthome_nginx:
    image: nginx:latest
    container_name: smarthome_web_nginx
    depends_on:
      api-gateway:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./Docker.nginx.conf:/etc/nginx/nginx.conf
    ports:
      - 81:80
    restart: always
    networks:
      - smarthome-network


volumes:
  postgres_data:
  kafka_data:

networks:
  smarthome-network:
    driver: bridge