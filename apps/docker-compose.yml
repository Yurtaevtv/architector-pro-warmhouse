services:
  # База данных
  postgres:
    image: postgres:16-alpine
    container_name: smart-home-postgres
    environment:
      POSTGRES_MULTIPLE_DATABASES: device, scenario
      POSTGRES_USER: smarthome_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome_user -d smarthome"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: smart-home-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
 
  # Frontend
  frontend:
    build:
      context: ${FRONTEND_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-frontend
    ports:
      - "3000:80"
    networks:
      - smarthome-network

  # API Gateway
  api-gateway:
    build:
      context: ${API_GATEWAY_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=smarthome;Username=smarthome_user;Password=${POSTGRES_PASSWORD:-Smarthome123!}
      - Kafka__BootstrapServers=kafka:9092
      - Redis__ConnectionString=redis:6379
      - JWT__Secret=${JWT_SECRET:-YourSuperSecretKeyForJWTTokens123!}
    ports:
      - "7000:80"
      - "7001:443"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Device Service
  device-service:
    build:
      context: ${DEVICE_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-device-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=smarthome;Username=smarthome_user;Password=${POSTGRES_PASSWORD:-Smarthome123!}
      - Kafka__BootstrapServers=kafka:9092
      - Redis__ConnectionString=redis:6379
    ports:
      - "7005:80"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Scenario Service
  scenario-service:
    build:
      context: ${SCENARIO_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-scenario-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=smarthome;Username=smarthome_user;Password=${POSTGRES_PASSWORD:-Smarthome123!}
      - Kafka__BootstrapServers=kafka:9092
    ports:
      - "7004:80"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket Service
  websocket-service:
    build:
      context: ${WEBSOCKET_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-websocket-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=smarthome;Username=smarthome_user;Password=${POSTGRES_PASSWORD:-Smarthome123!}
      - Kafka__BootstrapServers=kafka:9092
      - Redis__ConnectionString=redis:6379
    ports:
      - "7002:80"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Integration Service
  integration-service:
    build:
      context: ${INTEGRAION_CONTEXT}
      dockerfile: Dockerfile
    container_name: smart-home-integration-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgreSQL=Host=postgres;Database=smarthome;Username=smarthome_user;Password=${POSTGRES_PASSWORD:-Smarthome123!}
      - Kafka__BootstrapServers=kafka:9092
      - MQTT__BrokerUrl=mqtt://mosquitto:1883
      - Zigbee__CoordinatorPath=/dev/ttyUSB0
    ports:
      - "7003:80"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  kafka_data:

networks:
  smarthome-network:
    driver: bridge