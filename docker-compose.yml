services:
  postgres_db_original:
    image: postgres:18-alpine
    container_name: smart-home-postgres-original
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8432:5432"
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init-device.sql
    networks:
      - smarthome-network-original
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 10s
      timeout: 5s
      retries: 5


  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    platform: linux/amd64
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - smarthome-network-original
      
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    platform: linux/amd64
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CREATE_TOPICS: "device-command:1:1"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 1s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smarthome-network-original

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - smarthome-network-original

  temperature-api:
    build:
      context: ${TEMPERATURE_API_CONTEXT}
      dockerfile: Dockerfile
    container_name: temperature-api
    platform: linux/amd64
    environment:
      - ASPNETCORE_HTTP_PORTS=8081
    networks:
      - smarthome-network-original

  telemetry-service-api:
    build:
      context: ${TELEMETRY_CONTEXT}
      dockerfile: Dockerfile
    container_name: telemetry-api
    platform: linux/amd64
    depends_on:
      smart-home:
        condition: service_started
      temperature-api:
        condition: service_started
    ports:
      - "8082:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8082
      - Kafka__BootstrapServers=${KAFKA_SERVER}
      - Application__SmartHomeUrl=http://smart-home:8080
    networks:
      - smarthome-network-original
      
  device-service-api:
    build:
      context: ${DEVICE_CONTEXT}
      dockerfile: Dockerfile
    container_name: device-service-api
    platform: linux/amd64
    depends_on:
      smart-home:
        condition: service_started
      temperature-api:
        condition: service_started
    ports:
      - "8083:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8083
      - Kafka__BootstrapServers=${KAFKA_SERVER}
      - Application__SmartHomeUrl=http://smart-home:8080
    networks:
      - smarthome-network-original

  smart-home:
    build:
      context: ${SMARTHOME_ORIGINAL}
      dockerfile: Dockerfile
    container_name: smarthome-original
    depends_on:
      postgres_db_original:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres_db_original:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - smarthome-network-original




volumes:
  postgres_data:

networks:
  smarthome-network-original:
    driver: bridge