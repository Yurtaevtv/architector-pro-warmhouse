worker_processes 1;

events { worker_connections 1024; }

http {

    upstream api_gateway {
        server api-gateway:5000;
    }

    upstream front_end {
        server frontend:80;
    }
	
    server {
        listen 80;
        server_name api.gateway.local;
        location / {
            proxy_pass http://api_gateway;
        }
    }
    
    server {
        listen 80;
        server_name smarthome.local;
        location / {
            proxy_pass http://front_end;
        }
    }
}
